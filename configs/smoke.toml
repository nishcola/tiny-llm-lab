[model]
context_length = 64
embedding_dim = 128
num_layers = 2
num_heads = 4
mlp_dim = 512
dropout = 0.0

[data]
path = "data/tiny_shakespeare.txt"
train_fraction = 0.9
source_url = "https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt"

[tokenizer]
kind = "character"

[training]
device = "cpu"
seed = 1337
batch_size = 4
gradient_accumulation_steps = 1
max_steps = 25
learning_rate = 0.0003
weight_decay = 0.1
max_grad_norm = 1.0
eval_interval = 25
eval_batches = 2
checkpoint_interval = 25
output_dir = "checkpoints/smoke"
max_timeline_checkpoints = 2
