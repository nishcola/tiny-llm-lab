[model]
context_length = 128
embedding_dim = 192
num_layers = 4
num_heads = 4
mlp_dim = 768
dropout = 0.1

[data]
path = "data/tiny_shakespeare.txt"
train_fraction = 0.9
source_url = "https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt"

[tokenizer]
vocabulary_size = 320

[training]
device = "auto"
seed = 1337
batch_size = 16
gradient_accumulation_steps = 2
max_steps = 2000
learning_rate = 0.0003
weight_decay = 0.1
max_grad_norm = 1.0
eval_interval = 100
eval_batches = 20
checkpoint_interval = 500
output_dir = "checkpoints"
