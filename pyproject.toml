[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-llm-lab"
version = "0.1.0"
description = "A small, inspectable decoder-only transformer built with PyTorch primitives."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
ui = ["streamlit>=1.42,<2"]

[project.scripts]
tiny-llm = "tiny_llm_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider --basetemp=.test-tmp"
